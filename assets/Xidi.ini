[Mapper]
Type = RockmanDash2

[CustomMapper:RockmanDash2]
Template = StandardGamepad
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
DpadUp = Axis(Y, -)
DpadDown = Axis(Y, +)
DpadLeft = Axis(X, -)
DpadRight = Axis(X, +)
ButtonA = Button(2)
ButtonB = Button(3)
ButtonX = Button(4)
ButtonY = Button(5)
ButtonLB = Button(7)
ButtonRB = Button(8)
TriggerLT = Button(6)
TriggerRT = Button(1)
ButtonBack = Button(10)
ButtonStart = Button(9)

[Properties]
DeadzonePercentStickLeft = 10
DeadzonePercentStickRight = 10

[Workarounds]
ActiveVirtualControllerMask = 0x01

[Log]
Enabled = no